<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YUBugginMe?</title>

  <!-- linking src -->
  <link rel="stylesheet" href="./src/css/style.css">
  <script src="./src/js/bug.js" defer></script>
  <script src="./src/js/app.js" defer></script>

  <!-- linking fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>

  <header class="site-header">
    <a href="./index.html"><h1>Y U Buggin Me</h1></a>
    <div class="header-actions">
      <label class="btn btn-light" for="importFile">Import JSON</label>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <button type="button" id="exportButton" class="btn">Export JSON</button>
    </div>
  </header>

  <main>
    <p id="message" class="message" role="status" hidden></p>

    <section class="dashboard" aria-label="Dashboard" id="dashboard"></section>

    <div class="layout">
      <section class="panel" aria-labelledby="formTitle">
        <h2 id="formTitle">Report a bug</h2>
        <form id="bugForm" novalidate>
          <label for="bugTitle">Title</label>
          <input id="bugTitle" type="text" maxlength="120" autocomplete="off">

          <div class="row">
            <div>
              <label for="bugPriority">Priority</label>
              <select id="bugPriority">
                <option value="">Choose...</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
              </select>
            </div>
            <div>
              <label for="bugStatus">Status</label>
              <select id="bugStatus">
                <option value="">Choose...</option>
                <option value="open">Open</option>
                <option value="ongoing">Ongoing</option>
                <option value="resolved">Resolved</option>
              </select>
            </div>
          </div>

          <label for="bugLabels">Labels <span class="hint">(separated by commas)</span></label>
          <input id="bugLabels" type="text" placeholder="javascript, interface">

          <div class="row">
            <div>
              <label for="bugPage">Page</label>
              <input id="bugPage" type="text">
            </div>
            <div>
              <label for="bugBrowser">Browser</label>
              <input id="bugBrowser" type="text">
            </div>
          </div>

          <ul id="formErrors" class="errors" role="alert"></ul>
          <button type="submit" class="btn">Add bug</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="listTitle">
        <h2 id="listTitle">Overview</h2>

        <div class="filters">
          <input id="search" type="search" placeholder="Search title or label" aria-label="Search">
          <select id="filterStatus" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option value="open">Open</option>
            <option value="ongoing">Ongoing</option>
            <option value="resolved">Resolved</option>
          </select>
          <select id="filterPriority" aria-label="Filter by priority">
            <option value="">All priorities</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>

        <p id="empty" class="empty" hidden>No bugs match these filters.</p>
        <ul id="bugList" class="bug-list"></ul>
      </section>
    </div>
  </main>

</body>
</html>
